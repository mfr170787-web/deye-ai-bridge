<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mit hjem</title><style>
:root{color-scheme:dark;--bg:#07131d;--card:#102635;--line:#294a5e;--cyan:#29c7e8;--green:#62e28d;--yellow:#ffd152;--orange:#ff9e4c;--text:#eef9fc;--muted:#9eb6c3;--red:#ff7777}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#16425a 0,transparent 30%),linear-gradient(145deg,#06111b,#0d2736);color:var(--text);font:15px system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:20px}.head{display:flex;align-items:center;justify-content:space-between;gap:15px}.head h1{margin:0;font-size:29px}.muted{color:var(--muted)}button,select,input{border:1px solid var(--line);border-radius:11px;padding:10px;background:#0b1c28;color:var(--text)}button{background:var(--cyan);color:#04202a;border:0;font-weight:800;cursor:pointer}.secondary{background:#203e50;color:var(--text)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}.widget{position:relative;min-height:170px;background:linear-gradient(145deg,#132e40,#0b202d);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 30px #0005;overflow:hidden}.widget.wide{grid-column:span 2}.widget.dragging{opacity:.35}.icon{font-size:30px}.title{color:var(--muted);margin-top:8px}.value{font-size:29px;font-weight:900;margin-top:5px}.sub{font-size:12px;color:#bfd3dd;margin-top:8px;line-height:1.5}.toggle{margin-top:12px;background:#24485a;color:var(--text)}.toggle.on{background:var(--green);color:#062415}.light-controls{display:flex;align-items:center;gap:8px;margin-top:10px}.light-controls input[type=range]{padding:0;width:120px}.light-controls input[type=color]{padding:2px;width:38px;height:34px}.energy-lines{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.energy-cell{background:#091a26;border:1px solid #25485c;border-radius:12px;padding:10px}.energy-cell b{display:block;font-size:19px;margin-top:3px}.tools{display:none;position:absolute;right:8px;top:8px;gap:5px}.editing .tools{display:flex}.tools button{padding:5px 8px;background:#27485a;color:white}.editor{display:none;margin-top:18px;background:#102635;border:1px dashed var(--cyan);border-radius:17px;padding:16px}.editing .editor{display:block}.editor-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}.editor select{min-width:220px;max-width:100%}.status{border:1px solid var(--green);color:var(--green);border-radius:99px;padding:7px 11px}.error{color:var(--red)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:570px){main{padding:12px}.grid{grid-template-columns:1fr}.widget.wide{grid-column:span 1}.energy-lines{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><main id="app"><div class="head"><div><h1>Mit hjem</h1><div class="muted">Energi · lys · temperatur · vejr</div></div><div><span id="status" class="status">Forbundet</span> <button id="editButton" class="secondary" onclick="toggleEdit()">Redigér dashboard</button></div></div><div id="grid" class="grid"></div><section class="editor"><b>Tilføj widget</b><div class="editor-row"><select id="areaFilter" onchange="fillEntities()"><option value="">Alle rum</option></select><select id="typeFilter" onchange="fillEntities()"><option value="">Alle typer</option><option value="light">Lys</option><option value="switch">Kontakter</option><option value="sensor">Sensorer</option><option value="weather">Vejr</option><option value="climate">Klima</option><option value="binary_sensor">Binære sensorer</option><option value="cover">Gardiner/porte</option><option value="fan">Ventilatorer</option></select><select id="entityPicker"></select><button onclick="addEntity()">Tilføj</button></div><div class="editor-row"><button class="secondary" onclick="addBuiltIn('energy')">+ Energiflow</button><button class="secondary" onclick="addBuiltIn('price')">+ Elpris</button><button class="secondary" onclick="addBuiltIn('solar')">+ Solprognose</button><button class="secondary" onclick="addBuiltIn('clock')">+ Ur</button></div><p class="muted">Træk widgets for at flytte dem. ↔ ændrer størrelse, og × fjerner widgetten.</p></section></main><script>
const api=p=>p.replace(/^\//,'');let entities=[],layout={widgets:[]},deye=null,editing=false,dragged=null;const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function call(p,o){const r=await fetch(api(p),o),j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}const watts=v=>v==null?'–':Math.abs(Math.round(v)).toLocaleString('da-DK')+' W';const kwh=v=>v==null?'–':Number(v).toLocaleString('da-DK',{minimumFractionDigits:1,maximumFractionDigits:1})+' kWh';const fmt=(v,d=1)=>v==null?'–':Number(v).toFixed(d);
function icon(e){if(!e)return'◻️';if(e.domain==='light')return'💡';if(['switch','input_boolean'].includes(e.domain))return'⏻';if(e.domain==='weather')return'🌦️';if(e.domain==='climate'||e.device_class==='temperature')return'🌡️';if(e.device_class==='humidity')return'💧';if(e.domain==='cover')return'🪟';if(e.domain==='lock')return'🔒';if(e.domain==='fan')return'🌀';return'📟'}function value(e){if(!e)return'Enhed mangler';if(e.domain==='weather'&&e.temperature!=null)return e.temperature+' °C';if(['light','switch','input_boolean','fan'].includes(e.domain))return e.state==='on'?'Tændt':'Slukket';return `${e.state??'–'}${e.unit?' '+e.unit:''}`}
function tools(w){return `<div class="tools"><button onclick="resize('${esc(w.id)}')">↔</button><button onclick="removeW('${esc(w.id)}')">×</button></div>`}function builtIn(w){const s=deye?.data?.sample||{},market=deye?.data||{};if(w.type==='energy')return `<div class="icon">⚡</div><div class="title">${esc(w.title||'Energiflow')}</div><div class="energy-lines"><div class="energy-cell">☀️ Sol<b>${watts(s.pv_w)}</b></div><div class="energy-cell">⚡ Net<b>${watts(s.grid_w)}</b></div><div class="energy-cell">🔋 Batteri<b>${fmt(s.soc,0)} %</b></div><div class="energy-cell">⌂ Hus<b>${watts(s.load_w)}</b></div></div><div class="sub">Sol i dag ${kwh(s.pv_today)} · Købt ${kwh(s.grid_import_today)} · Forbrug ${kwh(s.load_today)}</div>`;if(w.type==='price')return `<div class="icon">💰</div><div class="title">Elpris nu</div><div class="value">${fmt(s.price_dkk,3)} kr/kWh</div><div class="sub">Andel FlexEnergi inkl. variable tariffer og afgifter</div>`;if(w.type==='solar'){const f=(market.solar_forecast||[])[0]||{};return `<div class="icon">☀️</div><div class="title">Solprognose i dag</div><div class="value">${kwh(f.energy_kwh)}</div><div class="sub">Målt ${kwh(s.pv_today)} · producerer nu ${watts(s.pv_w)}</div>`}return `<div class="icon">🕘</div><div class="title">Tid</div><div class="value">${new Date().toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'})}</div><div class="sub">${new Date().toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'})}</div>`}
function entityCard(w){const e=entities.find(x=>x.entity_id===w.entity_id);if(!e)return `<div class="error">${esc(w.entity_id)} findes ikke længere.</div>`;const toggle=['light','switch','input_boolean','fan'].includes(e.domain);let controls=toggle?`<button class="toggle ${e.state==='on'?'on':''}" onclick="control('${esc(e.entity_id)}','toggle')">${e.state==='on'?'Sluk':'Tænd'}</button>`:'';if(e.domain==='cover')controls=`<button class="toggle" onclick="control('${esc(e.entity_id)}','open_cover')">Åbn</button> <button class="toggle" onclick="control('${esc(e.entity_id)}','close_cover')">Luk</button>`;if(e.domain==='light'&&e.state==='on'){const b=Math.round((e.brightness||255)/2.55),hasColor=(e.supported_color_modes||[]).some(x=>!['onoff','brightness','color_temp'].includes(x));controls+=`<div class="light-controls"><span>☀️</span><input type="range" min="1" max="100" value="${b}" onchange="setBrightness('${esc(e.entity_id)}',this.value)">${hasColor?`<input type="color" value="${rgbHex(e.rgb_color)}" onchange="setColor('${esc(e.entity_id)}',this.value)">`:''}</div>`}return `<div class="icon">${icon(e)}</div><div class="title">${esc(w.title||e.name)}</div><div class="value">${esc(value(e))}</div><div class="sub">${esc(e.area||'Intet rum')} · ${esc(e.entity_id)}</div>${controls}`}
function render(){const grid=$('#grid');grid.innerHTML=layout.widgets.map(w=>`<article class="widget ${w.size==='wide'?'wide':''}" draggable="${editing}" data-id="${esc(w.id)}">${tools(w)}${w.type==='entity'?entityCard(w):builtIn(w)}</article>`).join('');grid.querySelectorAll('.widget').forEach(el=>{el.ondragstart=()=>{dragged=el.dataset.id;el.classList.add('dragging')};el.ondragend=()=>el.classList.remove('dragging');el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const to=layout.widgets.findIndex(x=>x.id===el.dataset.id),from=layout.widgets.findIndex(x=>x.id===dragged);if(from<0||to<0||from===to)return;layout.widgets.splice(to,0,layout.widgets.splice(from,1)[0]);save()}})}async function save(){layout=await call('api/layout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(layout)});render()}function toggleEdit(){editing=!editing;$('#app').classList.toggle('editing',editing);$('#editButton').textContent=editing?'Færdig':'Redigér dashboard';render()}function resize(id){const w=layout.widgets.find(x=>x.id===id);w.size=w.size==='wide'?'normal':'wide';save()}function removeW(id){layout.widgets=layout.widgets.filter(x=>x.id!==id);save()}function addBuiltIn(type){layout.widgets.push({id:type+Date.now(),type,title:'',size:type==='energy'?'wide':'normal'});save()}function addEntity(){const id=$('#entityPicker').value,e=entities.find(x=>x.entity_id===id);if(!id||layout.widgets.some(x=>x.entity_id===id))return;layout.widgets.push({id:'e'+Date.now(),type:'entity',entity_id:id,title:e.name,size:'normal'});save()}
function fillEntities(){const area=$('#areaFilter').value,type=$('#typeFilter').value;$('#entityPicker').innerHTML=entities.filter(e=>(!area||e.area===area)&&(!type||e.domain===type)).map(e=>`<option value="${esc(e.entity_id)}">${esc(e.name)} · ${esc(e.area||'Intet rum')}</option>`).join('')}async function control(id,action,extra={}){await call('api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entity_id:id,action,...extra})});setTimeout(refreshEntities,350)}function setBrightness(id,v){control(id,'turn_on',{brightness_pct:+v})}function hexRgb(h){return[h.slice(1,3),h.slice(3,5),h.slice(5,7)].map(x=>parseInt(x,16))}function rgbHex(rgb){if(!rgb)return'#ffffff';return'#'+rgb.map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,'0')).join('')}function setColor(id,v){control(id,'turn_on',{rgb_color:hexRgb(v)})}
async function refreshEntities(){entities=await call('api/entities');const areas=[...new Set(entities.map(x=>x.area).filter(Boolean))];$('#areaFilter').innerHTML='<option value="">Alle rum</option>'+areas.map(a=>`<option>${esc(a)}</option>`).join('');fillEntities();render()}function showConnection(){if(!deye)return;$('#status').textContent=deye.connected?'Forbundet':'Deye mangler';$('#status').classList.toggle('error',!deye.connected)}async function refreshDeye(){deye=await call('api/deye');showConnection();render()}async function start(){try{[layout,entities,deye]=await Promise.all([call('api/layout'),call('api/entities'),call('api/deye')]);const areas=[...new Set(entities.map(x=>x.area).filter(Boolean))];$('#areaFilter').innerHTML='<option value="">Alle rum</option>'+areas.map(a=>`<option>${esc(a)}</option>`).join('');fillEntities();showConnection();render()}catch(e){$('#status').textContent=e.message;$('#status').classList.add('error')}}start();setInterval(refreshDeye,15000);setInterval(refreshEntities,30000);setInterval(render,60000);
</script></body></html>
