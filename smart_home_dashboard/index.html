<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mit hjem</title><style>
:root{color-scheme:dark;--bg:#07131d;--card:#102635;--line:#294a5e;--cyan:#29c7e8;--green:#62e28d;--yellow:#ffd152;--orange:#ff9e4c;--text:#eef9fc;--muted:#9eb6c3;--red:#ff7777}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#16425a 0,transparent 30%),linear-gradient(145deg,#06111b,#0d2736);color:var(--text);font:15px system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:20px}.head{display:flex;align-items:center;justify-content:space-between;gap:15px}.head-left{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.head h1{margin:0;font-size:29px}.datebar{display:flex;align-items:baseline;gap:9px;padding-left:18px;border-left:1px solid #376072}.datebar-time{font-size:22px;font-weight:900;color:var(--cyan);font-variant-numeric:tabular-nums}.datebar-date{color:#d7e7ee;text-transform:capitalize}.muted{color:var(--muted)}button,select,input{border:1px solid var(--line);border-radius:11px;padding:10px;background:#0b1c28;color:var(--text)}button{background:var(--cyan);color:#04202a;border:0;font-weight:800;cursor:pointer}.secondary{background:#203e50;color:var(--text)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:82px;grid-auto-flow:dense;gap:14px;margin-top:18px}.widget{position:relative;grid-row:span 2;min-height:178px;background:linear-gradient(145deg,#132e40,#0b202d);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 30px #0005;overflow:hidden}.widget.h-half{grid-row:span 1;min-height:82px;padding:12px}.widget.h-half .icon{font-size:21px}.widget.h-half .value{font-size:20px}.widget.h-half .sub,.widget.h-half .light-controls{display:none}.widget.h-half .title{margin-top:2px}.widget.h-half .toggle{margin-top:5px;padding:6px 9px}.widget.h-medium{grid-row:span 3;min-height:274px}.widget.h-tall{grid-row:span 4;min-height:370px}.widget.wide{grid-column:span 2}.widget.dragging{opacity:.35}.icon{font-size:30px}.title{color:var(--muted);margin-top:8px}.value{font-size:29px;font-weight:900;margin-top:5px}.energy-outlook{display:flex;flex-direction:column;height:calc(100% - 22px);min-height:128px}.outlook-half{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px;flex:1}.outlook-half+.outlook-half{border-top:1px solid #34566a;margin-top:13px;padding-top:13px}.outlook-icon{font-size:34px}.outlook-label{font-size:12px;color:var(--muted)}.outlook-value{font-size:24px;font-weight:900;margin-top:2px}.outlook-detail{font-size:11px;color:#bfd3dd;margin-top:4px;line-height:1.4}.sub{font-size:12px;color:#bfd3dd;margin-top:8px;line-height:1.5}.toggle{margin-top:12px;background:#24485a;color:var(--text)}.toggle.on{background:var(--green);color:#062415}.light-controls{display:flex;align-items:center;gap:8px;margin-top:10px}.light-controls input[type=range]{padding:0;width:120px}.light-controls input[type=color]{padding:2px;width:38px;height:34px}.tools{display:none;position:absolute;right:8px;top:8px;gap:5px;z-index:5}.editing .tools{display:flex}.tools button{padding:5px 8px;background:#27485a;color:white}.editor{display:none;margin-top:18px;background:#102635;border:1px dashed var(--cyan);border-radius:17px;padding:16px}.editing .editor{display:block}.editor-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}.editor select{min-width:220px;max-width:100%}.status{border:1px solid var(--green);color:var(--green);border-radius:99px;padding:7px 11px}.error{color:var(--red)}.energy-widget{grid-column:1/-1;grid-row:span 7;min-height:562px}.flow{position:relative;max-width:760px;height:500px;margin:auto}.flow svg.wires{position:absolute;inset:0;width:100%;height:100%}.wire{fill:none;stroke:#385a6e;stroke-width:4}.pulse{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:1 15;animation:move 1.4s linear infinite}.reverse{animation-direction:reverse}@keyframes move{to{stroke-dashoffset:-64}}.flow-node{position:absolute;transform:translate(-50%,-50%);width:165px;text-align:center}.flow-node .box{width:68px;height:68px;margin:auto;display:grid;place-items:center;border:2px solid #416b82;border-radius:19px;background:#123044;font-size:30px;box-shadow:0 9px 24px #0006;overflow:hidden}.flow-node .nvalue{font-size:21px;font-weight:900;margin-top:5px}.flow-node .nlabel{color:var(--muted)}.flow-node .details{font-size:11px;line-height:1.5;margin-top:4px}.sun{left:20%;top:14%}.grid-node{left:80%;top:14%}.inverter{left:50%;top:47%}.battery-node{left:18%;top:82%}.house{left:82%;top:82%}.car{left:50%;top:88%}.car-photo{width:100%;height:100%;object-fit:cover;display:block}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:570px){main{padding:12px}.grid{grid-template-columns:1fr}.widget.wide{grid-column:span 1}.energy-widget{grid-column:1;grid-row:span 7;min-height:562px}.flow{height:500px}.flow-node{width:135px}.sun{left:21%}.grid-node{left:79%}.battery-node{left:20%}.house{left:80%}.flow-node .details{font-size:9px}.head{align-items:flex-start;flex-direction:column}.head-left{gap:8px}.datebar{padding-left:10px}.datebar-time{font-size:20px}.datebar-date{font-size:12px}}
  .battery-node .box.home-battery{position:relative;width:86px;height:58px;overflow:visible;border-radius:12px;background:#171a1d;font-size:22px;font-weight:900}.battery-node .box.home-battery::after{content:"";position:absolute;right:-10px;top:17px;width:7px;height:24px;border-radius:0 5px 5px 0;background:currentColor}.battery-node .home-battery.soc-high{color:var(--green);border-color:var(--green);box-shadow:0 0 28px #42df7d66}.battery-node .home-battery.soc-medium{color:var(--yellow);border-color:var(--yellow);box-shadow:0 0 25px #ffd15255}.battery-node .home-battery.soc-low{color:var(--red);border-color:var(--red);box-shadow:0 0 24px #ff525255}.battery-node .home-battery.soc-unknown{color:#7b8b95;border-color:#647681;box-shadow:none}
</style></head><body><main id="app"><div class="head"><div class="head-left"><div><h1>Mit hjem</h1><div class="muted">Energi · lys · temperatur · vejr</div></div><div class="datebar"><span id="headerTime" class="datebar-time">--:--</span><span id="headerDate" class="datebar-date">Henter dato…</span></div></div><div><span id="status" class="status">Forbundet</span> <button id="editButton" class="secondary" onclick="toggleEdit()">Redigér dashboard</button></div></div><div id="grid" class="grid"></div><section class="editor"><b>Tilføj widget</b><div class="editor-row"><select id="areaFilter" onchange="fillEntities()"><option value="">Alle rum</option></select><select id="typeFilter" onchange="fillEntities()"><option value="">Alle typer</option><option value="light">Lys</option><option value="switch">Kontakter</option><option value="sensor">Sensorer</option><option value="weather">Vejr</option><option value="climate">Klima</option><option value="binary_sensor">Binære sensorer</option><option value="cover">Gardiner/porte</option><option value="fan">Ventilatorer</option></select><select id="entityPicker"></select><button onclick="addEntity()">Tilføj</button></div><div class="editor-row"><button class="secondary" onclick="addBuiltIn('energy')">+ Energiflow</button><button class="secondary" onclick="addBuiltIn('price')">+ Elpris og solprognose</button><button class="secondary" onclick="addBuiltIn('clock')">+ Ur</button></div><div class="editor-row"><input id="groupName" value="Stue" placeholder="Navn på gruppe"><select id="groupAreaFilter" onchange="fillGroupEntities()"><option value="">Alle områder</option></select><select id="groupPicker" multiple size="5" title="Markér flere enheder med Ctrl eller Cmd"></select><button onclick="addGroup()">+ Gruppe</button></div><p class="muted">Gruppen kan indeholde lys, kontakter og gardiner. Markér flere med Ctrl på Windows eller Cmd på Mac. ✎ ændrer navn, ↔ bredde, ↕ højde (inkl. halv), og × fjerner.</p></section></main><script>
const api=p=>p.replace(/^\//,'');let entities=[],layout={widgets:[]},deye=null,editing=false,dragged=null;const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function call(p,o){const r=await fetch(api(p),o),j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}const watts=v=>v==null?'–':Math.abs(Math.round(v)).toLocaleString('da-DK')+' W';const kwh=v=>v==null?'–':Number(v).toLocaleString('da-DK',{minimumFractionDigits:1,maximumFractionDigits:1})+' kWh';const fmt=(v,d=1)=>v==null?'–':Number(v).toFixed(d);
function icon(e){if(!e)return'◻️';if(e.domain==='light')return'💡';if(['switch','input_boolean'].includes(e.domain))return'⏻';if(e.domain==='weather')return'🌦️';if(e.domain==='climate'||e.device_class==='temperature')return'🌡️';if(e.device_class==='humidity')return'💧';if(e.domain==='cover')return'🪟';if(e.domain==='lock')return'🔒';if(e.domain==='fan')return'🌀';return'📟'}function value(e){if(!e)return'Enhed mangler';if(e.domain==='weather'&&e.temperature!=null)return e.temperature+' °C';if(['light','switch','input_boolean','fan'].includes(e.domain))return e.state==='on'?'Tændt':'Slukket';return `${e.state??'–'}${e.unit?' '+e.unit:''}`}
function tools(w){return `<div class="tools"><button title="Redigér navn" onclick="renameWidget('${esc(w.id)}')">✎</button><button title="Skift ikon" onclick="changeIcon('${esc(w.id)}')">🎨</button><button title="Skift bredde" onclick="resize('${esc(w.id)}')">↔</button><button title="Skift højde" onclick="resizeHeight('${esc(w.id)}')">↕</button><button onclick="removeW('${esc(w.id)}')">×</button></div>`}
function teslaIcon(){return `<img class="car-photo" src="tesla_icon.jpeg" alt="Matgrøn Tesla Model 3 2019">`}
function batterySocClass(soc){const value=Number(soc);return soc===null||soc===undefined||!Number.isFinite(value)?'soc-unknown':value>60?'soc-high':value>=30?'soc-medium':'soc-low'}
function energyFlow(s,title,customIcon){const gridReverse=Number(s.grid_w)<0,battReverse=Number(s.battery_w)<0;return `<div class="title">${customIcon?esc(customIcon)+' ':''}${esc(title||'Energiflow')}</div><div class="flow"><svg class="wires" viewBox="0 0 600 500" preserveAspectRatio="none"><path class="wire" d="M120 70 L300 235"/><path class="pulse" stroke="#ffd152" d="M120 70 L300 235"/><path class="wire" d="M480 70 L300 235"/><path class="pulse ${gridReverse?'reverse':''}" stroke="#58aaff" d="M480 70 L300 235"/><path class="wire" d="M108 410 L300 235"/><path class="pulse ${battReverse?'reverse':''}" stroke="#ff9e4c" d="M108 410 L300 235"/><path class="wire" d="M300 235 L492 410"/><path class="pulse" stroke="#62e28d" d="M300 235 L492 410"/><path class="wire" d="M300 235 L300 440"/></svg><div class="flow-node sun"><div class="box">☀️</div><div class="nvalue">${watts(s.pv_w)}</div><div class="nlabel">Sol</div><div class="details">PV1 ${watts(s.pv1_w)} · PV2 ${watts(s.pv2_w)}<br>I dag ${kwh(s.pv_today)}</div></div><div class="flow-node grid-node"><div class="box">⚡</div><div class="nvalue">${watts(s.grid_w)}</div><div class="nlabel">${gridReverse?'Eksport til net':'Import fra net'}</div><div class="details">L1 ${watts(s.grid_l1_w)} · L2 ${watts(s.grid_l2_w)} · L3 ${watts(s.grid_l3_w)}<br>Købt ${kwh(s.grid_import_today)} · Solgt ${kwh(s.grid_export_today)}</div></div><div class="flow-node inverter"><div class="box">▥</div><div class="nlabel">Inverter</div></div><div class="flow-node battery-node"><div class="box home-battery ${batterySocClass(s.soc)}">${fmt(s.soc,0)} %</div><div class="nvalue">${watts(s.battery_w)}</div><div class="nlabel">${Number(s.battery_w)<-5?'Oplader':Number(s.battery_w)>5?'Aflader':'Batteri'}</div><div class="details">Ladet ${kwh(s.battery_charge_today)} · Afladet ${kwh(s.battery_discharge_today)}</div></div><div class="flow-node house"><div class="box">⌂</div><div class="nvalue">${watts(s.load_w)}</div><div class="nlabel">Hus</div><div class="details">I dag ${kwh(s.load_today)}</div></div><div class="flow-node car"><div class="box">${teslaIcon()}</div><div class="nvalue">Ikke kortlagt</div><div class="nlabel">Tesla-lader</div></div></div>`}
function builtIn(w){const s=deye?.data?.sample||{},market=deye?.data||{},f=(market.solar_forecast||[])[0]||{};if(w.type==='energy')return energyFlow(s,w.title,w.icon);if(w.type==='price'||w.type==='solar')return `<div class="title">${w.icon?`<span class="icon">${esc(w.icon)}</span> `:''}${esc(w.title||'Elpris og solprognose')}</div><div class="energy-outlook"><div class="outlook-half"><div class="outlook-icon">⚡</div><div><div class="outlook-label">Elpris lige nu</div><div class="outlook-value">${fmt(s.price_dkk,3)} kr/kWh</div><div class="outlook-detail">Andel FlexEnergi inkl. variable tariffer og afgifter</div></div></div><div class="outlook-half"><div class="outlook-icon">☀️</div><div><div class="outlook-label">Solproduktion</div><div class="outlook-value">${kwh(s.pv_today)} i dag</div><div class="outlook-detail">Nu ${watts(s.pv_w)} · prognose ${kwh(f.energy_kwh)}</div></div></div></div>`;return `<div class="icon">${esc(w.icon||'🕘')}</div><div class="title">${esc(w.title||'Tid')}</div><div class="value">${new Date().toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'})}</div><div class="sub">${new Date().toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'})}</div>`}
function entityCard(w){const e=entities.find(x=>x.entity_id===w.entity_id);if(!e)return `<div class="error">${esc(w.entity_id)} findes ikke længere.</div>`;const toggle=['light','switch','input_boolean','fan'].includes(e.domain);let controls=toggle?`<button class="toggle ${e.state==='on'?'on':''}" onclick="control('${esc(e.entity_id)}','toggle')">${e.state==='on'?'Sluk':'Tænd'}</button>`:'';if(e.domain==='cover')controls=`<button class="toggle" onclick="control('${esc(e.entity_id)}','open_cover')">Åbn</button> <button class="toggle" onclick="control('${esc(e.entity_id)}','close_cover')">Luk</button>`;if(e.domain==='light'&&e.state==='on'){const b=Math.round((e.brightness||255)/2.55),hasColor=(e.supported_color_modes||[]).some(x=>!['onoff','brightness','color_temp'].includes(x));controls+=`<div class="light-controls"><span>☀️</span><input type="range" min="1" max="100" value="${b}" onchange="setBrightness('${esc(e.entity_id)}',this.value)">${hasColor?`<input type="color" value="${rgbHex(e.rgb_color)}" onchange="setColor('${esc(e.entity_id)}',this.value)">`:''}</div>`}return `<div class="icon">${esc(w.icon||icon(e))}</div><div class="title">${esc(w.title||e.name)}</div><div class="value">${esc(value(e))}</div><div class="sub">${esc(e.area||'Intet rum')} · ${esc(e.entity_id)}</div>${controls}`}
function groupCard(w){const members=(w.entity_ids||[]).map(id=>entities.find(e=>e.entity_id===id)).filter(Boolean),hasCover=members.some(e=>e.domain==='cover');return `<div class="icon">${esc(w.icon||'🔗')}</div><div class="title">Gruppe</div><div class="value">${esc(w.title||'Gruppe')}</div><div class="sub">${members.map(e=>esc(e.name)).join(' · ')}</div><button class="toggle" onclick="controlGroup('${esc(w.id)}','group_on')">Tænd/åbn alle</button>${hasCover?` <button class="toggle" onclick="controlGroup('${esc(w.id)}','group_stop')">Stop gardiner</button>`:''} <button class="toggle" onclick="controlGroup('${esc(w.id)}','group_off')">Sluk/luk alle</button>`}
function render(){const grid=$('#grid');grid.innerHTML=layout.widgets.map(w=>`<article class="widget ${w.size==='wide'?'wide':''} h-${esc(w.height||'normal')} ${w.type==='energy'?'energy-widget':''}" draggable="${editing}" data-id="${esc(w.id)}">${tools(w)}${w.type==='entity'?entityCard(w):['group','cover_group'].includes(w.type)?groupCard(w):builtIn(w)}</article>`).join('');grid.querySelectorAll('.widget').forEach(el=>{el.ondragstart=()=>{dragged=el.dataset.id;el.classList.add('dragging')};el.ondragend=()=>el.classList.remove('dragging');el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const to=layout.widgets.findIndex(x=>x.id===el.dataset.id),from=layout.widgets.findIndex(x=>x.id===dragged);if(from<0||to<0||from===to)return;layout.widgets.splice(to,0,layout.widgets.splice(from,1)[0]);save()}})}async function save(){layout=await call('api/layout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(layout)});render()}function toggleEdit(){editing=!editing;$('#app').classList.toggle('editing',editing);$('#editButton').textContent=editing?'Færdig':'Redigér dashboard';render()}function resize(id){const w=layout.widgets.find(x=>x.id===id);w.size=w.size==='wide'?'normal':'wide';save()}function resizeHeight(id){const w=layout.widgets.find(x=>x.id===id),levels=['half','normal','medium','tall'],i=levels.indexOf(w.height||'normal');w.height=levels[(i+1)%levels.length];save()}function renameWidget(id){const w=layout.widgets.find(x=>x.id===id),name=prompt('Nyt navn til widget',w?.title||'');if(w&&name!==null&&name.trim()){w.title=name.trim();save()}}function changeIcon(id){const w=layout.widgets.find(x=>x.id===id),symbol=prompt('Nyt ikon – indsæt fx 💡, 🪟 eller 🌡️',w?.icon||'');if(w&&symbol!==null){w.icon=symbol.trim().slice(0,12);save()}}function removeW(id){layout.widgets=layout.widgets.filter(x=>x.id!==id);save()}function addBuiltIn(type){layout.widgets.push({id:type+Date.now(),type,title:'',icon:'',size:type==='energy'?'wide':'normal',height:'normal'});save()}function addEntity(){const id=$('#entityPicker').value,e=entities.find(x=>x.entity_id===id);if(!id||layout.widgets.some(x=>x.entity_id===id))return;layout.widgets.push({id:'e'+Date.now(),type:'entity',entity_id:id,title:e.name,icon:'',size:'normal',height:'normal'});save()}function addGroup(){const ids=[...$('#groupPicker').selectedOptions].map(x=>x.value),title=$('#groupName').value.trim()||'Gruppe';if(ids.length<2){alert('Markér mindst to enheder');return}layout.widgets.push({id:'g'+Date.now(),type:'group',entity_ids:ids,title,icon:'',size:'normal',height:'normal'});save()}
function fillGroupEntities(){const area=$('#groupAreaFilter').value;$('#groupPicker').innerHTML=entities.filter(e=>['light','switch','input_boolean','fan','cover'].includes(e.domain)&&(!area||e.area===area)).map(e=>`<option value="${esc(e.entity_id)}">${esc(e.name)} · ${esc(e.domain)}</option>`).join('')}function fillEntities(){const area=$('#areaFilter').value,type=$('#typeFilter').value;$('#entityPicker').innerHTML=entities.filter(e=>(!area||e.area===area)&&(!type||e.domain===type)).map(e=>`<option value="${esc(e.entity_id)}">${esc(e.name)} · ${esc(e.area||'Intet rum')}</option>`).join('');fillGroupEntities()}async function control(id,action,extra={}){await call('api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entity_id:id,action,...extra})});setTimeout(refreshEntities,350)}async function controlGroup(id,action){const w=layout.widgets.find(x=>x.id===id);if(!w)return;await call('api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entity_ids:w.entity_ids,action})});setTimeout(refreshEntities,350)}function setBrightness(id,v){control(id,'turn_on',{brightness_pct:+v})}function hexRgb(h){return[h.slice(1,3),h.slice(3,5),h.slice(5,7)].map(x=>parseInt(x,16))}function rgbHex(rgb){if(!rgb)return'#ffffff';return'#'+rgb.map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,'0')).join('')}function setColor(id,v){control(id,'turn_on',{rgb_color:hexRgb(v)})}
function updateAreaMenus(){const areas=[...new Set(entities.map(x=>x.area).filter(Boolean))],a=$('#areaFilter').value,g=$('#groupAreaFilter').value,opts=areas.map(x=>`<option>${esc(x)}</option>`).join('');$('#areaFilter').innerHTML='<option value="">Alle rum</option>'+opts;$('#groupAreaFilter').innerHTML='<option value="">Alle områder</option>'+opts;$('#areaFilter').value=a;$('#groupAreaFilter').value=g}function updateHeaderClock(){const now=new Date();$('#headerTime').textContent=now.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('#headerDate').textContent=now.toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}async function refreshEntities(){entities=await call('api/entities');updateAreaMenus();fillEntities();render()}function showConnection(){if(!deye)return;$('#status').textContent=deye.connected?'Forbundet':'Deye mangler';$('#status').classList.toggle('error',!deye.connected)}async function refreshDeye(){deye=await call('api/deye');showConnection();render()}async function start(){updateHeaderClock();try{[layout,entities,deye]=await Promise.all([call('api/layout'),call('api/entities'),call('api/deye')]);updateAreaMenus();fillEntities();showConnection();render()}catch(e){$('#status').textContent=e.message;$('#status').classList.add('error')}}start();setInterval(updateHeaderClock,1000);setInterval(refreshDeye,15000);setInterval(refreshEntities,30000);setInterval(render,60000);
</script></body></html>
